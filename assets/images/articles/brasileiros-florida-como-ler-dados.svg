<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Como interpretar dados sobre brasileiros na Flórida</title>
  <desc id="desc">Quatro cartões explicam nascimento no Brasil, ancestralidade, estimativa consular e presença comunitária.</desc>
  <rect width="1200" height="675" rx="32" fill="#f8fafc"/>
  <text x="70" y="82" fill="#0f172a" font-family="Georgia,serif" font-size="40" font-weight="700">O que significa “brasileiros” nos dados?</text>
  <text x="70" y="122" fill="#475569" font-family="Arial,sans-serif" font-size="22">A resposta muda conforme a fonte e a pergunta.</text>
  <g font-family="Arial,sans-serif">
    <rect x="70" y="170" width="250" height="330" rx="22" fill="#fff" stroke="#cbd5e1"/>
    <circle cx="120" cy="222" r="26" fill="#0ea5e9"/><text x="105" y="231" fill="#fff" font-size="25" font-weight="700">1</text>
    <text x="100" y="284" fill="#0f172a" font-size="25" font-weight="700">Nascimento</text><text x="100" y="316" fill="#0f172a" font-size="25" font-weight="700">no Brasil</text>
    <text x="100" y="366" fill="#475569" font-size="19">Tabela B05006.</text><text x="100" y="400" fill="#475569" font-size="19">Não mede cidadania</text><text x="100" y="430" fill="#475569" font-size="19">nem descendentes</text><text x="100" y="460" fill="#475569" font-size="19">nascidos nos EUA.</text>
    <rect x="340" y="170" width="250" height="330" rx="22" fill="#fff" stroke="#cbd5e1"/>
    <circle cx="390" cy="222" r="26" fill="#22c55e"/><text x="375" y="231" fill="#fff" font-size="25" font-weight="700">2</text>
    <text x="370" y="284" fill="#0f172a" font-size="25" font-weight="700">Ancestralidade</text><text x="370" y="316" fill="#0f172a" font-size="25" font-weight="700">brasileira</text>
    <text x="370" y="366" fill="#475569" font-size="19">Tabela B04006.</text><text x="370" y="400" fill="#475569" font-size="19">Resposta autodeclarada;</text><text x="370" y="430" fill="#475569" font-size="19">pode incluir mais de</text><text x="370" y="460" fill="#475569" font-size="19">uma ancestralidade.</text>
    <rect x="610" y="170" width="250" height="330" rx="22" fill="#fff" stroke="#cbd5e1"/>
    <circle cx="660" cy="222" r="26" fill="#f97316"/><text x="645" y="231" fill="#fff" font-size="25" font-weight="700">3</text>
    <text x="640" y="284" fill="#0f172a" font-size="25" font-weight="700">Estimativa</text><text x="640" y="316" fill="#0f172a" font-size="25" font-weight="700">consular</text>
    <text x="640" y="366" fill="#475569" font-size="19">Estima cidadãos por</text><text x="640" y="400" fill="#475569" font-size="19">jurisdição. Não é uma</text><text x="640" y="430" fill="#475569" font-size="19">contagem municipal</text><text x="640" y="460" fill="#475569" font-size="19">do Census.</text>
    <rect x="880" y="170" width="250" height="330" rx="22" fill="#fff" stroke="#cbd5e1"/>
    <circle cx="930" cy="222" r="26" fill="#eab308"/><text x="915" y="231" fill="#fff" font-size="25" font-weight="700">4</text>
    <text x="910" y="284" fill="#0f172a" font-size="25" font-weight="700">Comunidade</text><text x="910" y="316" fill="#0f172a" font-size="25" font-weight="700">visível</text>
    <text x="910" y="366" fill="#475569" font-size="19">Serviços, igrejas e</text><text x="910" y="400" fill="#475569" font-size="19">comércio ajudam a</text><text x="910" y="430" fill="#475569" font-size="19">entender a rede, mas</text><text x="910" y="460" fill="#475569" font-size="19">não são censo.</text>
    <rect x="195" y="545" width="810" height="70" rx="18" fill="#0f172a"/><text x="600" y="588" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">Métricas diferentes não devem ser somadas ou tratadas como equivalentes.</text>
  </g>
</svg>
