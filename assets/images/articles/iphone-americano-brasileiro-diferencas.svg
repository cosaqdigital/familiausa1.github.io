<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Diferenças entre iPhone americano e brasileiro</title>
  <desc id="desc">Comparação visual de eSIM, modelo regional, rede 5G e homologação da Anatel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10233b"/>
      <stop offset="1" stop-color="#1f4b43"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#07131f" flood-opacity=".24"/>
    </filter>
  </defs>
  <rect width="1200" height="675" rx="34" fill="url(#bg)"/>
  <text x="66" y="75" fill="#f0c36b" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">COMPARAÇÃO REGIONAL</text>
  <text x="66" y="133" fill="#fffaf1" font-family="Georgia, serif" font-size="46" font-weight="700">Americano x brasileiro: o que muda?</text>
  <text x="66" y="174" fill="#d9e2ef" font-family="Arial, sans-serif" font-size="22">A diferença está na configuração, não em uma qualidade secreta.</text>

  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(66 225)">
      <rect width="250" height="275" rx="24" fill="#fffaf1"/>
      <circle cx="52" cy="54" r="25" fill="#2f5c4f"/>
      <path d="M43 54h18M52 45v18" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <text x="32" y="108" fill="#111d2e" font-size="25" font-weight="700">SIM</text>
      <text x="32" y="150" fill="#5d5549" font-size="18">EUA atuais:</text>
      <text x="32" y="180" fill="#111d2e" font-size="19" font-weight="700">somente eSIM</text>
      <text x="32" y="220" fill="#5d5549" font-size="18">Brasil atual:</text>
      <text x="32" y="250" fill="#111d2e" font-size="19" font-weight="700">eSIM + nano-SIM*</text>
    </g>
    <g transform="translate(338 225)">
      <rect width="250" height="275" rx="24" fill="#fffaf1"/>
      <circle cx="52" cy="54" r="25" fill="#c96b3b"/>
      <text x="40" y="63" fill="#fff" font-size="24" font-weight="700">A</text>
      <text x="32" y="108" fill="#111d2e" font-size="25" font-weight="700">MODELO</text>
      <text x="32" y="150" fill="#5d5549" font-size="18">O mesmo nome pode</text>
      <text x="32" y="180" fill="#5d5549" font-size="18">usar números A</text>
      <text x="32" y="210" fill="#5d5549" font-size="18">diferentes em cada</text>
      <text x="32" y="240" fill="#111d2e" font-size="19" font-weight="700">região de venda.</text>
    </g>
    <g transform="translate(610 225)">
      <rect width="250" height="275" rx="24" fill="#fffaf1"/>
      <circle cx="52" cy="54" r="25" fill="#315b86"/>
      <path d="M38 61c8-13 20-13 28 0M43 52c5-7 13-7 18 0M51 67h2" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <text x="32" y="108" fill="#111d2e" font-size="25" font-weight="700">REDE 5G</text>
      <text x="32" y="150" fill="#5d5549" font-size="18">Bandas e mmWave</text>
      <text x="32" y="180" fill="#5d5549" font-size="18">podem variar.</text>
      <text x="32" y="220" fill="#111d2e" font-size="19" font-weight="700">Confira o modelo e</text>
      <text x="32" y="250" fill="#111d2e" font-size="19" font-weight="700">a sua operadora.</text>
    </g>
    <g transform="translate(882 225)">
      <rect width="250" height="275" rx="24" fill="#fffaf1"/>
      <circle cx="52" cy="54" r="25" fill="#d7a72f"/>
      <path d="M40 54l8 8 16-19" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="32" y="108" fill="#111d2e" font-size="25" font-weight="700">ANATEL</text>
      <text x="32" y="150" fill="#5d5549" font-size="18">Não é outra linha</text>
      <text x="32" y="180" fill="#5d5549" font-size="18">de iPhone.</text>
      <text x="32" y="220" fill="#111d2e" font-size="19" font-weight="700">É preciso verificar</text>
      <text x="32" y="250" fill="#111d2e" font-size="19" font-weight="700">a homologação.</text>
    </g>
  </g>
  <rect x="66" y="550" width="1066" height="64" rx="20" fill="#f0c36b"/>
  <text x="599" y="590" text-anchor="middle" fill="#111d2e" font-family="Arial, sans-serif" font-size="21" font-weight="700">*A configuração depende da geração e do país. Sempre confira o número do modelo.</text>
</svg>
