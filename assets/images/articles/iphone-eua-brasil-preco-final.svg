<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Como calcular o preço final de um iPhone comprado nos Estados Unidos</title>
  <desc id="desc">Fluxo que soma preço nos Estados Unidos, sales tax, câmbio efetivo e custos da compra antes de comparar com o preço no Brasil.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111d2e"/>
      <stop offset="1" stop-color="#243d5d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#08111f" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="675" rx="36" fill="url(#bg)"/>
  <circle cx="1088" cy="88" r="160" fill="#c28a2c" opacity=".13"/>
  <circle cx="90" cy="650" r="220" fill="#2f8c73" opacity=".12"/>

  <text x="70" y="72" fill="#f0c36b" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">GUIA DE PREÇO</text>
  <text x="70" y="132" fill="#fffaf1" font-family="Georgia, serif" font-size="48" font-weight="700">A etiqueta não é a conta final</text>
  <text x="70" y="172" fill="#d9e2ef" font-family="Arial, sans-serif" font-size="24">Faça a mesma conta nos dois países antes de decidir.</text>

  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <g transform="translate(70 230)">
      <rect width="200" height="132" rx="20" fill="#fffaf1"/>
      <text x="24" y="42" fill="#8b321e" font-size="18" font-weight="700">1. PREÇO EUA</text>
      <text x="24" y="78" fill="#111d2e" font-size="23" font-weight="700">Mesmo modelo</text>
      <text x="24" y="107" fill="#5d5549" font-size="17">e armazenamento</text>
    </g>
    <text x="288" y="306" fill="#f0c36b" font-size="42" font-weight="700">+</text>
    <g transform="translate(330 230)">
      <rect width="200" height="132" rx="20" fill="#fffaf1"/>
      <text x="24" y="42" fill="#8b321e" font-size="18" font-weight="700">2. SALES TAX</text>
      <text x="24" y="78" fill="#111d2e" font-size="23" font-weight="700">Taxa do local</text>
      <text x="24" y="107" fill="#5d5549" font-size="17">cobrada no caixa</text>
    </g>
    <text x="548" y="306" fill="#f0c36b" font-size="42" font-weight="700">+</text>
    <g transform="translate(590 230)">
      <rect width="220" height="132" rx="20" fill="#fffaf1"/>
      <text x="24" y="42" fill="#8b321e" font-size="18" font-weight="700">3. CÂMBIO</text>
      <text x="24" y="78" fill="#111d2e" font-size="23" font-weight="700">Taxa efetiva</text>
      <text x="24" y="107" fill="#5d5549" font-size="17">com tarifas e IOF</text>
    </g>
    <text x="828" y="306" fill="#f0c36b" font-size="42" font-weight="700">+</text>
    <g transform="translate(870 230)">
      <rect width="260" height="132" rx="20" fill="#fffaf1"/>
      <text x="24" y="42" fill="#8b321e" font-size="18" font-weight="700">4. OUTROS CUSTOS</text>
      <text x="24" y="78" fill="#111d2e" font-size="23" font-weight="700">Acessórios e viagem</text>
      <text x="24" y="107" fill="#5d5549" font-size="17">quando se aplicarem</text>
    </g>
  </g>

  <g transform="translate(70 410)" font-family="Arial, sans-serif">
    <rect width="1060" height="150" rx="26" fill="#2f5c4f"/>
    <text x="42" y="52" fill="#d8f0e8" font-size="20" font-weight="700" letter-spacing="2">RESULTADO</text>
    <text x="42" y="99" fill="#ffffff" font-size="34" font-weight="700">Custo real nos EUA</text>
    <text x="384" y="99" fill="#f0c36b" font-size="34" font-weight="700">versus</text>
    <text x="520" y="99" fill="#ffffff" font-size="34" font-weight="700">preço real no Brasil</text>
    <text x="42" y="130" fill="#d8f0e8" font-size="18">Inclua parcelamento, suporte e condição de garantia na decisão.</text>
  </g>
  <text x="70" y="625" fill="#d9e2ef" font-family="Arial, sans-serif" font-size="19">Compare valores consultados no mesmo dia. Preços e câmbio mudam.</text>
  <text x="1130" y="625" fill="#f0c36b" text-anchor="end" font-family="Arial, sans-serif" font-size="18" font-weight="700">FamiliaUSA1</text>
</svg>
