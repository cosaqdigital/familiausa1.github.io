<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo de decisão para saber se vale a pena comprar iPhone nos Estados Unidos</title>
  <desc id="desc">Quatro perguntas sobre viagem, diferença de preço, compatibilidade e garantia levam à conclusão de que a compra pode fazer sentido ou precisa ser reconsiderada.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf1"/>
      <stop offset="1" stop-color="#efe5d6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#392e21" flood-opacity=".15"/>
    </filter>
  </defs>
  <rect width="1200" height="675" rx="36" fill="url(#bg)"/>
  <path d="M0 0h420l-72 675H0z" fill="#111d2e"/>
  <text x="64" y="80" fill="#f0c36b" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">DECISÃO DE COMPRA</text>
  <text x="64" y="145" fill="#fffaf1" font-family="Georgia, serif" font-size="45" font-weight="700">Vale a pena</text>
  <text x="64" y="195" fill="#fffaf1" font-family="Georgia, serif" font-size="45" font-weight="700">comprar</text>
  <text x="64" y="245" fill="#fffaf1" font-family="Georgia, serif" font-size="45" font-weight="700">nos EUA?</text>
  <text x="64" y="305" fill="#d9e2ef" font-family="Arial, sans-serif" font-size="20">Não existe um “sim” automático.</text>
  <text x="64" y="336" fill="#d9e2ef" font-family="Arial, sans-serif" font-size="20">Passe por estas quatro perguntas.</text>

  <g transform="translate(390 70)" font-family="Arial, sans-serif" filter="url(#shadow)">
    <g>
      <circle cx="38" cy="54" r="30" fill="#c28a2c"/>
      <text x="38" y="63" text-anchor="middle" fill="#111d2e" font-size="25" font-weight="700">1</text>
      <rect x="84" width="650" height="108" rx="20" fill="#ffffff"/>
      <text x="112" y="45" fill="#111d2e" font-size="24" font-weight="700">A viagem já aconteceria sem essa compra?</text>
      <text x="112" y="76" fill="#5d5549" font-size="18">Se a viagem existe só por causa do aparelho, some passagem e hospedagem.</text>
    </g>
    <g transform="translate(0 132)">
      <circle cx="38" cy="54" r="30" fill="#c28a2c"/>
      <text x="38" y="63" text-anchor="middle" fill="#111d2e" font-size="25" font-weight="700">2</text>
      <rect x="84" width="650" height="108" rx="20" fill="#ffffff"/>
      <text x="112" y="45" fill="#111d2e" font-size="24" font-weight="700">A diferença permanece boa após a conta final?</text>
      <text x="112" y="76" fill="#5d5549" font-size="18">Inclua sales tax, câmbio efetivo e custos realmente necessários.</text>
    </g>
    <g transform="translate(0 264)">
      <circle cx="38" cy="54" r="30" fill="#c28a2c"/>
      <text x="38" y="63" text-anchor="middle" fill="#111d2e" font-size="25" font-weight="700">3</text>
      <rect x="84" width="650" height="108" rx="20" fill="#ffffff"/>
      <text x="112" y="45" fill="#111d2e" font-size="24" font-weight="700">O modelo atende seu uso no Brasil?</text>
      <text x="112" y="76" fill="#5d5549" font-size="18">Confirme desbloqueio, eSIM e compatibilidade antes do pagamento.</text>
    </g>
    <g transform="translate(0 396)">
      <circle cx="38" cy="54" r="30" fill="#c28a2c"/>
      <text x="38" y="63" text-anchor="middle" fill="#111d2e" font-size="25" font-weight="700">4</text>
      <rect x="84" width="650" height="108" rx="20" fill="#ffffff"/>
      <text x="112" y="45" fill="#111d2e" font-size="24" font-weight="700">Você aceita as condições de troca e suporte?</text>
      <text x="112" y="76" fill="#5d5549" font-size="18">A economia deve compensar também a diferença de conveniência.</text>
    </g>
  </g>

  <g transform="translate(390 600)" font-family="Arial, sans-serif">
    <rect width="350" height="48" rx="24" fill="#2f5c4f"/>
    <text x="175" y="31" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">Quatro respostas “sim”: pode compensar</text>
    <rect x="370" width="350" height="48" rx="24" fill="#9b3d25"/>
    <text x="545" y="31" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">Algum “não”: refaça a comparação</text>
  </g>
  <text x="64" y="612" fill="#d9e2ef" font-family="Arial, sans-serif" font-size="16">Decisão editorial;</text>
  <text x="64" y="636" fill="#d9e2ef" font-family="Arial, sans-serif" font-size="16">não é promessa de economia.</text>
</svg>
