<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Checklist para comparar a compra de um iPhone nos Estados Unidos e no Brasil</title>
  <desc id="desc">Lista visual com modelo, armazenamento, preço atual, sales tax, câmbio efetivo, pagamento, garantia, eSIM e regras de bagagem.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17304d"/>
      <stop offset="1" stop-color="#2f5c4f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#07131f" flood-opacity=".24"/>
    </filter>
  </defs>
  <rect width="1200" height="675" rx="36" fill="url(#bg)"/>
  <text x="64" y="72" fill="#f0c36b" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">ANTES DE PAGAR</text>
  <text x="64" y="132" fill="#fffaf1" font-family="Georgia, serif" font-size="48" font-weight="700">Checklist da compra sem surpresa</text>
  <text x="64" y="171" fill="#d9e2ef" font-family="Arial, sans-serif" font-size="22">Marque cada ponto com dados do mesmo dia e do mesmo aparelho.</text>

  <g transform="translate(64 220)" font-family="Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(0 0)">
      <rect width="330" height="95" rx="18" fill="#fffaf1"/>
      <rect x="22" y="28" width="38" height="38" rx="9" fill="#e8f2ed" stroke="#2f5c4f" stroke-width="3"/>
      <path d="M31 47l8 8 14-18" fill="none" stroke="#2f5c4f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="82" y="43" fill="#111d2e" font-size="21" font-weight="700">Mesmo modelo</text>
      <text x="82" y="70" fill="#5d5549" font-size="17">e armazenamento</text>
    </g>
    <g transform="translate(365 0)">
      <rect width="330" height="95" rx="18" fill="#fffaf1"/>
      <rect x="22" y="28" width="38" height="38" rx="9" fill="#e8f2ed" stroke="#2f5c4f" stroke-width="3"/>
      <path d="M31 47l8 8 14-18" fill="none" stroke="#2f5c4f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="82" y="43" fill="#111d2e" font-size="21" font-weight="700">Preço atualizado</text>
      <text x="82" y="70" fill="#5d5549" font-size="17">EUA e Brasil</text>
    </g>
    <g transform="translate(730 0)">
      <rect width="330" height="95" rx="18" fill="#fffaf1"/>
      <rect x="22" y="28" width="38" height="38" rx="9" fill="#e8f2ed" stroke="#2f5c4f" stroke-width="3"/>
      <path d="M31 47l8 8 14-18" fill="none" stroke="#2f5c4f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="82" y="43" fill="#111d2e" font-size="21" font-weight="700">Sales tax</text>
      <text x="82" y="70" fill="#5d5549" font-size="17">do endereço da compra</text>
    </g>
    <g transform="translate(0 125)">
      <rect width="330" height="95" rx="18" fill="#fffaf1"/>
      <rect x="22" y="28" width="38" height="38" rx="9" fill="#e8f2ed" stroke="#2f5c4f" stroke-width="3"/>
      <path d="M31 47l8 8 14-18" fill="none" stroke="#2f5c4f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="82" y="43" fill="#111d2e" font-size="21" font-weight="700">Dólar efetivo</text>
      <text x="82" y="70" fill="#5d5549" font-size="17">com tarifas e IOF</text>
    </g>
    <g transform="translate(365 125)">
      <rect width="330" height="95" rx="18" fill="#fffaf1"/>
      <rect x="22" y="28" width="38" height="38" rx="9" fill="#e8f2ed" stroke="#2f5c4f" stroke-width="3"/>
      <path d="M31 47l8 8 14-18" fill="none" stroke="#2f5c4f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="82" y="43" fill="#111d2e" font-size="21" font-weight="700">Pagamento</text>
      <text x="82" y="70" fill="#5d5549" font-size="17">à vista ou parcelado</text>
    </g>
    <g transform="translate(730 125)">
      <rect width="330" height="95" rx="18" fill="#fffaf1"/>
      <rect x="22" y="28" width="38" height="38" rx="9" fill="#e8f2ed" stroke="#2f5c4f" stroke-width="3"/>
      <path d="M31 47l8 8 14-18" fill="none" stroke="#2f5c4f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="82" y="43" fill="#111d2e" font-size="21" font-weight="700">Troca e garantia</text>
      <text x="82" y="70" fill="#5d5549" font-size="17">condições confirmadas</text>
    </g>
    <g transform="translate(0 250)">
      <rect width="330" height="95" rx="18" fill="#fffaf1"/>
      <rect x="22" y="28" width="38" height="38" rx="9" fill="#e8f2ed" stroke="#2f5c4f" stroke-width="3"/>
      <path d="M31 47l8 8 14-18" fill="none" stroke="#2f5c4f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="82" y="43" fill="#111d2e" font-size="21" font-weight="700">Desbloqueio</text>
      <text x="82" y="70" fill="#5d5549" font-size="17">aparelho unlocked</text>
    </g>
    <g transform="translate(365 250)">
      <rect width="330" height="95" rx="18" fill="#fffaf1"/>
      <rect x="22" y="28" width="38" height="38" rx="9" fill="#e8f2ed" stroke="#2f5c4f" stroke-width="3"/>
      <path d="M31 47l8 8 14-18" fill="none" stroke="#2f5c4f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="82" y="43" fill="#111d2e" font-size="21" font-weight="700">eSIM e rede</text>
      <text x="82" y="70" fill="#5d5549" font-size="17">compatibilidade conferida</text>
    </g>
    <g transform="translate(730 250)">
      <rect width="330" height="95" rx="18" fill="#fffaf1"/>
      <rect x="22" y="28" width="38" height="38" rx="9" fill="#e8f2ed" stroke="#2f5c4f" stroke-width="3"/>
      <path d="M31 47l8 8 14-18" fill="none" stroke="#2f5c4f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="82" y="43" fill="#111d2e" font-size="21" font-weight="700">Bagagem</text>
      <text x="82" y="70" fill="#5d5549" font-size="17">regra oficial consultada</text>
    </g>
  </g>
  <rect x="64" y="598" width="1060" height="42" rx="21" fill="#f0c36b"/>
  <text x="594" y="625" text-anchor="middle" fill="#111d2e" font-family="Arial, sans-serif" font-size="19" font-weight="700">Se um item ainda está incerto, a comparação ainda não terminou.</text>
</svg>
