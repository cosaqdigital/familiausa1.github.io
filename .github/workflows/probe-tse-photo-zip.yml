name: Probe TSE presidential photos archive

on:
  push:
    branches:
      - fix/election-dashboard-visuals
    paths:
      - ".github/workflows/probe-tse-photo-zip.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Download and inspect official TSE archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 60 \
            "https://cdn.tse.jus.br/estatistica/sead/eleicoes/eleicoes2026/fotos/foto_cand2026_BR_div.zip" \
            --output /tmp/fotos.zip
          echo "ARCHIVE_BYTES=$(wc -c < /tmp/fotos.zip)"
          unzip -l /tmp/fotos.zip | sed -n '1,160p'

      - name: Map presidential candidates to photo filenames
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 60 \
            "https://cdn.tse.jus.br/estatistica/sead/odsele/consulta_cand/consulta_cand_2026.zip" \
            --output /tmp/candidatos.zip

          echo "CAND_ARCHIVE_BYTES=$(wc -c < /tmp/candidatos.zip)"
          unzip -l /tmp/candidatos.zip | grep -E 'BR.*csv|consulta_cand_2026_BR' || true

          file_name="$(unzip -Z1 /tmp/candidatos.zip | grep 'consulta_cand_2026_BR.csv' | head -n 1)"
          test -n "$file_name"

          unzip -p /tmp/candidatos.zip "$file_name" \
            | iconv -f ISO-8859-1 -t UTF-8 \
            | grep -Ei 'LULA|FLAVIO BOLSONARO' \
            | head -n 20
